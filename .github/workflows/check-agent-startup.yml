name: Audit complete office package 1.2.4
on:
  workflow_dispatch:
  push:
    branches: [codex/lan-clock-validation]
    paths-ignore:
      - '.github/workflows/rehearse-lan-windows.yml'
      - '.github/workflows/check-lan-package-launcher.yml'
      - 'apps/desktop-agent/tests/rehearsal/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: employee-startup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Exercise startup repair on Windows PowerShell 5
        shell: powershell
        run: ./apps/desktop-agent/tests/startup-repair.ps1
      - name: Validate clock and certificate gates
        shell: powershell
        run: ./apps/desktop-agent/tests/certificate-clock.ps1
      - name: Exercise full office checks and fail-closed evidence parsing
        shell: powershell
        run: ./apps/desktop-agent/tests/office-test.ps1
      - name: Exercise real Windows UI automation and scenario failure handling
        shell: powershell
        run: ./apps/desktop-agent/tests/quick-test.ps1
      - name: Exercise recovery checkpoints and report destination failures
        shell: powershell
        run: ./apps/desktop-agent/tests/recovery-report.ps1
      - name: Check read-only production verification with failure fixtures
        run: node --test apps/desktop-agent/tests/verify-office-test.test.mjs apps/desktop-agent/tests/gateway-startup.test.mjs
      - name: Run desktop regression checks
        run: dotnet run --project apps/desktop-agent/tests/Mandala.Agent.RegressionTests/Mandala.Agent.RegressionTests.csproj -c Release
      - name: Audit the approved production installer for the complete test kit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $kit='apps/desktop-agent/scripts/office-test'
          gh run download 35892308420 --name MandalaAgentSetup-1.0.16 --dir $kit
          if ($LASTEXITCODE -ne 0) { throw 'Approved installer download failed.' }
          $installer=(Resolve-Path "$kit/MandalaAgentSetup-1.0.16.exe").Path
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'f517f48ace1638cea05471224938a660bb1def0d1ac17a794a16c2737d30dccb' -or (Get-Item $installer).Length -ne 51062706) { throw 'Approved installer differs from original Windows audit.' }
          $installed=Join-Path $env:RUNNER_TEMP 'Mandala Approved Agent Audit'
          $process=Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"" -Wait -PassThru
          if($process.ExitCode -ne 0) { throw 'Approved installer failed.' }
          $agent=Join-Path $installed 'Mandala.Agent.exe'
          $config=Get-Content (Join-Path $installed 'agent.config.json') -Raw|ConvertFrom-Json
          if($config.supabaseUrl.TrimEnd('/') -ne 'https://nzlajptokbcgeaifgnoq.supabase.co' -or (Get-Item $agent).VersionInfo.ProductVersion -notmatch '^1\.0\.16(?:\.|\+|$)') { throw 'Approved version/backend mismatch.' }
          @{version='1.0.16';filename='MandalaAgentSetup-1.0.16.exe';installerSha256=$hash;installerBytes=51062706;backend='https://nzlajptokbcgeaifgnoq.supabase.co';agentSha256=(Get-FileHash $agent -Algorithm SHA256).Hash.ToLowerInvariant()}|ConvertTo-Json|Set-Content "$kit/approved-agent.json"
          if(-not(Test-Path (Join-Path $kit 'startup-repair'))) { Copy-Item 'apps/desktop-agent/scripts/startup-repair' $kit -Recurse }
          & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File apps/desktop-agent/tests/approved-agent-ui.ps1 -Agent $agent
          if($LASTEXITCODE -ne 0){throw 'Actual approved Agent UI compatibility failed.'}
          & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File apps/desktop-agent/tests/approved-agent-lan.ps1 -Agent $agent -ApprovedManifest "$kit/approved-agent.json"
          if($LASTEXITCODE -ne 0){throw 'Actual approved Agent LAN receipt/journal audit failed.'}
          # Validate real installation discovery from a 32-bit PowerShell host.
          $audit=Join-Path $env:RUNNER_TEMP 'check-discovery.ps1'
          @'
          param($Core,$Expected)
          $ErrorActionPreference='Stop'
          . $Core
          if((Get-MandalaAgentPath -MachineOnly) -ne $Expected) { throw '32-bit host did not discover the real 64-bit installation.' }
          Write-Host 'PASS: 32-bit PowerShell located the custom 64-bit installation.'
          '@ | Set-Content $audit
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File $audit -Core (Resolve-Path 'apps/desktop-agent/scripts/startup-repair/startup-core.ps1').Path -Expected $agent
          if($LASTEXITCODE -ne 0){throw '32-bit discovery audit failed.'}
          # Report export must work even on an unconfigured machine, without prompts.
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File "$kit/office-test.ps1" -Mode Export
          if($LASTEXITCODE -ne 0){throw 'Complete report export failed.'}
          $statePath=Join-Path $env:LOCALAPPDATA 'Mandala Office Test/employee.json'
          $state=Get-Content $statePath -Raw|ConvertFrom-Json
          $state.Email='office-audit@example.test'
          $state|ConvertTo-Json -Depth 15|Set-Content $statePath
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File "$kit/office-test.ps1" -Mode Preflight
          if($LASTEXITCODE -ne 0){throw 'Complete preflight did not return a report.'}
          $state=Get-Content $statePath -Raw|ConvertFrom-Json
          if($state.Checks.Count -lt 13){throw 'Main preflight stopped before all independent checks ran.'}
          if(@($state.Checks|Where-Object {$_.Id -eq 'employee.version-and-binary' -and $_.Status -eq 'PASS'}).Count -ne 1){throw 'Real installed binary did not match kit fingerprint.'}
          if($state.Result -ne 'NOT CLEARED'){throw 'Unconfigured fixture was incorrectly cleared.'}
          Write-Host 'PASS: actual preflight entry point exported every check and kept the unconfigured PC NOT CLEARED.'
      - name: Install packaging tool
        run: choco install innosetup --no-progress --yes
      - name: Repair a stopped installed gateway under Local Service and recover a bind failure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $download=Join-Path $env:RUNNER_TEMP 'approved-gateway'
          gh run download 34306122310 --name MandalaGatewaySetup-1.1.0 --dir $download
          if($LASTEXITCODE -ne 0){throw 'Approved gateway download failed.'}
          $installer=Join-Path $download 'MandalaGatewaySetup-1.1.0.exe'
          if((Get-Item $installer).Length -ne 24825179 -or (Get-FileHash $installer).Hash.ToLowerInvariant() -ne '0fd024c0cf69d8e913c048f5e3e20c2e50d2fdf0c4584dbc6108d5ac98150ce3'){throw 'Gateway installer differs from production audit.'}
          $installed=Join-Path $env:ProgramFiles 'Mandala Gateway Repair Audit'
          $p=Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"" -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Gateway installation failed.'}
          $release=Get-Content (Join-Path $installed 'gateway-release.json') -Raw|ConvertFrom-Json
          if($release.version -ne '1.1.0' -or $release.backendProjectRef -ne 'nzlajptokbcgeaifgnoq'){throw 'Gateway version/backend mismatch.'}
          $repair=(Resolve-Path 'apps/desktop-agent/scripts/office-test/gateway-repair').Path
          Copy-Item 'apps/lan-services/deploy/windows/pairing-core.ps1' (Join-Path $repair 'pairing-core.ps1')
          $files=@{}
          foreach($name in @('runtime\node.exe','gateway.mjs','security.mjs','start-gateway.mjs','gateway-release.json','pairing-core.ps1')){$files[$name]=(Get-FileHash (Join-Path $installed $name)).Hash.ToLowerInvariant()}
          @{version='1.1.0';backend='nzlajptokbcgeaifgnoq';files=$files}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $repair 'approved-gateway.json')
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File apps/lan-services/test/windows-pairing.ps1 -InstallDirectory $installed -RepairFolder $repair
          if($LASTEXITCODE -ne 0){throw 'Real Local Service gateway repair/recovery audit failed.'}
      - name: Build an unpublished installer fixture and check its installed startup entry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # No production key is needed or published for this packaging test.
          $config = 'apps/desktop-agent/src/Mandala.Agent/agent.config.json'
          @{supabaseUrl='https://nzlajptokbcgeaifgnoq.supabase.co';supabaseAnonKey='startup-audit-fixture'} | ConvertTo-Json | Set-Content $config
          dotnet publish apps/desktop-agent/src/Mandala.Agent/Mandala.Agent.csproj -c Release -r win-x64 --self-contained true -p:Version=1.0.0 -o apps/desktop-agent/publish
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed.' }
          $env:MANDALA_AGENT_VERSION='1.0.0'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" apps/desktop-agent/installer/MandalaAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'Fixture packaging failed.' }
          $installer = (Resolve-Path 'apps/desktop-agent/release/MandalaAgentSetup-1.0.0.exe').Path
          $installed = Join-Path $env:RUNNER_TEMP 'Mandala Startup Install Audit'
          $result = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Fixture install failed.' }
          ./apps/desktop-agent/scripts/audit-startup.ps1 -InstallDirectory $installed
          # Delete the link, then exercise the real elevated repair entry point.
          Remove-Item (Join-Path ([Environment]::GetFolderPath('CommonStartup')) 'Mandala Agent.lnk')
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File apps/desktop-agent/scripts/startup-repair/repair-startup.ps1 -CommonOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installed common startup repair failed.' }
          ./apps/desktop-agent/scripts/audit-startup.ps1 -InstallDirectory $installed
      - name: Package only the tested repair scripts
        shell: pwsh
        run: |
          $zip = 'MandalaAgentStartupRepair-1.0.1.zip'
          Compress-Archive -Path 'apps/desktop-agent/scripts/startup-repair/*' -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zip).Length
          "Repair audit passed: version=1.0.1 bytes=$size sha256=$hash" | Tee-Object -FilePath startup-repair-audit.txt
          $kitZip='MandalaRecoveryCandidate-1.2.4.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'Mandala Office Test Handoff'
          New-Item -ItemType Directory $stage -Force|Out-Null
          foreach($name in @('Start Mandala.cmd','READ-FIRST.txt','package-entry.ps1','report-core.ps1','recovery-evidence.ps1','quick-test.ps1','ui-driver.ps1','check-core.ps1','approved-agent.json','MandalaAgentSetup-1.0.16.exe','startup-repair','gateway-repair')) { Copy-Item (Join-Path 'apps/desktop-agent/scripts/office-test' $name) $stage -Recurse }
          $inventory=@(Get-ChildItem -LiteralPath $stage -Recurse -File|ForEach-Object {@{name=$_.FullName.Substring($stage.Length+1).Replace('\','/');bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}})
          @{version='1.2.4';backend='nzlajptokbcgeaifgnoq';sourceCommit=$env:GITHUB_SHA;releaseStatus='REHEARSAL_REQUIRED';files=$inventory}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $stage 'package-manifest.json')
          & powershell.exe -NoProfile -File apps/desktop-agent/tests/package-integrity.ps1 -PackageDirectory $stage
          if($LASTEXITCODE -ne 0){throw 'Staged package integrity tests failed.'}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $kitZip
          $extracted=Join-Path $env:RUNNER_TEMP 'Downloaded Candidate With Spaces'
          Expand-Archive -LiteralPath $kitZip -DestinationPath $extracted
          & powershell.exe -NoProfile -File (Join-Path $extracted 'package-entry.ps1') -Role gateway -Mode Export
          if($LASTEXITCODE -ne 0){throw 'Packaged export entry point failed.'}
          & powershell.exe -NoProfile -File apps/desktop-agent/tests/package-launcher.ps1 -PackageDirectory $extracted
          if($LASTEXITCODE -ne 0){throw 'Exact downloaded CMD and standard-user baseline audit failed.'}
          $kitHash=(Get-FileHash $kitZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $kitSize=(Get-Item $kitZip).Length
          "Candidate CI checks passed; real reboot and Agent rehearsal still required: version=1.2.4 bytes=$kitSize sha256=$kitHash" | Tee-Object -FilePath office-test-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MandalaRecoveryCandidate-1.2.4
          path: |
            MandalaAgentStartupRepair-1.0.1.zip
            startup-repair-audit.txt
            MandalaRecoveryCandidate-1.2.4.zip
            office-test-audit.txt
            ${{ runner.temp }}/approved-agent-lan-audit.json
            ${{ runner.temp }}/mandala-package-launcher-audit.json
          if-no-files-found: error
      - name: Preserve safe test summaries even if a later audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mandala-recovery-audit-evidence
          path: |
            ${{ runner.temp }}/approved-agent-lan-audit.json
            ${{ runner.temp }}/mandala-package-launcher-audit.json
          if-no-files-found: warn
