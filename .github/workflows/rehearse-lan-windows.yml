name: Rehearse isolated Windows gateway restart

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Host capability only, or actual disposable gateway guest reboot
        type: choice
        options: [capability, gateway-reboot, employee-reboot]
        default: capability
      candidate_run_id:
        description: Successful employee-startup audit run containing the exact candidate ZIP
        type: string
        required: false
      exercise:
        description: Exact downloaded launcher flow, or repair-module comparison only
        type: choice
        options: [packaged, module]
        default: packaged
  push:
    branches: [codex/lan-recovery-1.2.3]
    paths:
      - '.github/workflows/rehearse-lan-windows.yml'
      - 'apps/desktop-agent/tests/rehearsal/**'

permissions:
  contents: read
  actions: read

jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Execute a minimal nested guest without downloading Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mandala-rehearsal"
          cc -std=c11 -Wall -Wextra -Werror \
            apps/desktop-agent/tests/rehearsal/probe-kvm.c \
            -o "$RUNNER_TEMP/mandala-rehearsal/probe-kvm"
          sudo "$RUNNER_TEMP/mandala-rehearsal/probe-kvm" \
            | tee "$RUNNER_TEMP/mandala-rehearsal/kvm-result.txt"
          {
            printf '\nHost resources (not Windows acceptance evidence):\n'
            uname -m
            free -h
            df -h "$RUNNER_TEMP"
            printf '\nNo Windows image, production credentials or employee records were used.\n'
          } | tee "$RUNNER_TEMP/mandala-rehearsal/host-resources.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mandala-Windows-rehearsal-host-capability
          path: ${{ runner.temp }}/mandala-rehearsal/*.txt
          if-no-files-found: warn
  gateway-reboot:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'gateway-reboot'
    needs: capability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf libguestfs-tools python3-pil acl
      - name: Verify audited artifacts and run real guest reboot observation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GATEWAY_EXERCISE: ${{ inputs.exercise }}
          GH_REPO: ${{ github.repository }}
          LIBGUESTFS_BACKEND: direct
        run: python3 apps/desktop-agent/tests/rehearsal/run-gateway-guest.py
      - name: Preserve bounded rehearsal evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mandala-gateway-real-reboot-evidence
          path: ${{ runner.temp }}/mandala-gateway-rehearsal/evidence/
          if-no-files-found: warn

  employee-reboot:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'employee-reboot'
    needs: capability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable virtualization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf libguestfs-tools python3-pil acl
      - name: Rehearse exact audited installer with a standard Windows user
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_REPO: ${{ github.repository }}
          LIBGUESTFS_BACKEND: direct
        run: python3 apps/desktop-agent/tests/rehearsal/run-agent-guest.py
      - name: Preserve bounded employee rehearsal evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mandala-employee-real-reboot-evidence
          path: ${{ runner.temp }}/mandala-gateway-rehearsal/evidence/
          if-no-files-found: warn
